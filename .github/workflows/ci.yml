name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m schema_forge --help
      - run: python -m schema_forge infer examples/orders.csv --name orders --out /tmp/orders.json
      - run: python -m schema_forge validate examples/orders.csv --schema /tmp/orders.json
